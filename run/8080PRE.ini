; Run from the directory that contains the .COM and shim files.
; K5 shim: the SIO data port 1 is input-only by default, but OUT 0x01 is the console.
set cpu 8080
set sio port=1
set sio port=1/0/0/0/0/F/0/T
load shim-boot.bin 0
load shim-bdos.bin 5
load shim-handler.bin fe00
load 8080PRE.COM 100
d pc 100
d sp fe00
go
exit
