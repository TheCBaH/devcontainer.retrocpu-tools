name: release
on:
  push:
    tags: ['v*']
permissions:
  actions: read
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download packages of the validated build
        run: |
          run=$(gh run list --workflow build.yml --event push \
            --commit "$GITHUB_SHA" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          if test -z "$run"; then
            echo "No successful build of $GITHUB_SHA" >&2
            exit 1
          fi
          echo "Publishing artifacts of build run $run"
          gh run download "$run" -p 'packages-*' -D artifacts
          duplicates=$(find artifacts -type f -printf '%f\n' | sort | uniq -d)
          if test -n "$duplicates"; then
            echo "Duplicate artifact files: $duplicates" >&2
            exit 1
          fi
          mkdir dist
          find artifacts -type f -exec mv -t dist {} +
          for arch in x86_64 aarch64; do
            for f in retrocpu-tools-linux-$arch-musl.tar.xz retrocpu-diagnostics-$arch.tar.xz retrocpu-vm80a-sim-linux-$arch-musl.tar.xz diagnostics-run-$arch.log; do
              test -f "dist/$f" || { echo "Missing $f" >&2; exit 1; }
            done
          done
      - name: Publish
        run: |
          cd dist
          rm SHA256SUMS-*
          sha256sum *.tar.xz *.log > SHA256SUMS
          sha256sum -c SHA256SUMS
          flags=
          case $GITHUB_REF_NAME in *-*) flags=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" * $flags --verify-tag --title "$GITHUB_REF_NAME" \
            --notes 'Static musl altairz80 (SIMH), asl, p2bin, p2hex, the 8080PRE/8080EX1 diagnostics assembled with them, and vm80a_sim (Verilator model of the KR580VM80A, CC BY 3.0 vm80a), for x86_64 and aarch64. Built from the pinned sources, run offline on Debian and Alpine as non-root. Each archive carries its licences; SHA256SUMS covers all assets.'
